.ad-map{margin-top:26px;border:1px solid var(--line);border-radius:20px;padding:6px 24px 26px;background:radial-gradient(circle,var(--dot) .9px,transparent 1.1px) 0 0/18px 18px,color-mix(in srgb,var(--surface) 70%,transparent)}

.ad-map .stage-node{font-size:22px}
.stage-proposed .stage-node{border-style:dashed}
.stage-count{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.you-are-here.marker-blocked{background:var(--blocked);color:#2a1218}
.you-are-here.marker-blocked:after{border-top-color:var(--blocked)}
.is-waiting .stage-node{box-shadow:inset 0 0 0 5px var(--bg),0 0 0 9px color-mix(in srgb,var(--blocked) 14%,transparent),0 0 32px 10px color-mix(in srgb,var(--blocked) 12%,transparent)}

.ledger-stage:first-of-type{border-top:0;padding-top:4px}
.ledger-stage:focus-visible{outline-offset:2px;border-radius:10px}
.ledger-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ledger-num{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}

.ledger-count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ledger-count.all-done{color:var(--done)}
.ledger-rows{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.lrow.r-done{background:var(--task-done);border-color:color-mix(in srgb,var(--done) 18%,var(--line))}
.lrow.r-doing{background:var(--task-doing);border-color:color-mix(in srgb,var(--doing) 35%,var(--line))}
.lrow.r-blocked{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--blocked) 5%,transparent) 7px 14px),var(--task-blocked);border-color:color-mix(in srgb,var(--blocked) 45%,var(--line))}
.lrow.r-todo,.lrow.r-unknown{border-style:dashed}

.licon{grid-row:1/span 3;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid var(--line);color:var(--muted)}
.r-done .licon{background:var(--done);border-color:var(--done);color:var(--bg)}
.r-blocked .licon{border-color:var(--blocked);color:var(--blocked)}
.r-doing .licon{border-color:var(--doing);color:var(--doing)}
.r-todo .licon,.r-unknown .licon{border-style:dashed}
.ltop{display:flex;gap:8px 10px;align-items:baseline;flex-wrap:wrap}
.ltitle{font-size:15px;font-weight:720;line-height:1.4;letter-spacing:-.015em}
.lpanel{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:0 8px;font-weight:650}
.lchanged{font-size:12px;color:var(--accent);font-weight:700}
.lnote{font-size:14px;line-height:1.55;color:var(--muted)}

.r-done .lnote .k{color:var(--done)}
.lnote.blocker,.lnote.blocker .k{color:var(--blocked)}
.lnote.none{font-style:italic}

@media(max-width:800px){.ad-grid .side-column{order:-1}.ad-grid{display:flex;flex-direction:column;gap:14px}}
@media(max-width:650px){.stage.is-waiting{padding-top:34px;min-height:118px}.is-waiting .stage-node{top:36px}.stage.is-waiting:after{top:80px;height:calc(100% - 81px)}.ad-map{padding:2px 16px 18px;border-radius:16px}.ad-map .roadmap-section{padding:22px 0 0}.ledger-count{margin-left:0;width:100%}.lrow{padding:12px;gap:4px 10px;grid-template-columns:24px minmax(0,1fr)}.licon{width:24px;height:24px;font-size:12px}.decision-blocking .decision-title{font-size:18px}}

/* Activity motion follows the current stage; it is not a progress measurement. */
.is-current .stage-node::before{content:'';position:absolute;inset:-11px;border:2px solid var(--doing);border-radius:50%;pointer-events:none;opacity:0;animation:dashboard-beacon 2.8s ease-out infinite;animation-play-state:paused}
.direction-panel{position:relative}

html[data-motion=running] .is-current .stage-node.motion-visible::before{animation-play-state:running}
@keyframes dashboard-beacon{0%{transform:scale(.85);opacity:0}18%{opacity:.55}85%,100%{transform:scale(1.3);opacity:0}}

@media(prefers-reduced-motion:reduce){.is-current .stage-node::before{animation:none;opacity:0}}

/* Animate the action icon only, never a task card's border. */
.r-doing .licon{animation:dashboard-task-pulse 1.8s ease-in-out infinite;animation-play-state:paused}
.card-doing .status::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-left:9px;animation:dashboard-task-pulse 1.8s ease-in-out infinite;animation-play-state:paused}
.card-doing .status::before{margin-left:0;margin-right:7px}
html[data-motion=running] .r-doing .licon.motion-visible,html[data-motion=running] .card-doing .status.motion-visible::before{animation-play-state:running}
@keyframes dashboard-task-pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.r-doing .licon,.card-doing .status::before{animation:none;opacity:1;transform:none}}

/* The current action is visually distinct from the task ledger. */
.direction-panel.is-working{background:var(--task-doing)}
.direction-panel.is-working .current-work{font-size:21px;color:var(--fg);font-weight:800}
.direction-panel.is-working>h2{display:flex;align-items:center;gap:10px;color:var(--doing)}
.direction-panel .now-state{display:inline-flex;align-items:center;gap:7px;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--doing) 15%,transparent);font-size:12px;letter-spacing:0;text-transform:none}
.direction-panel .now-state::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--doing);animation:dashboard-task-pulse 1.8s ease-in-out infinite;animation-play-state:paused}
html[data-motion=running] .direction-panel.motion-visible .now-state::before{animation-play-state:running}
@media(prefers-reduced-motion:reduce){.direction-panel .now-state::before{animation:none;opacity:1;transform:none}}

/* The header status: a dot for transport and dashboard-agent activity. */
.connection{display:inline-flex;align-items:center;gap:8px;padding:4px 11px;border-radius:20px;transition:color .3s,background-color .3s}
.connection:before{margin-right:0;flex:none;transition:background-color .3s}
.connection[data-phase=connecting]:before{background:var(--muted)}
.connection[data-phase=error]{color:var(--blocked)}.connection[data-phase=error]:before{background:var(--blocked)}
.connection[data-phase=draft],.connection[data-phase=work]{color:var(--doing);background:color-mix(in srgb,var(--doing) 12%,transparent);font-weight:650}
.connection[data-phase=draft]:before,.connection[data-phase=work]:before{background:var(--doing);animation:dashboard-task-pulse 1.4s ease-in-out infinite;animation-play-state:paused}
.connection[data-phase=draft]:after,.connection[data-phase=work]:after{content:'';width:4px;height:4px;margin-right:12px;flex:none;border-radius:50%;--dim:color-mix(in srgb,currentColor 30%,transparent);background:currentColor;box-shadow:6px 0 var(--dim),12px 0 var(--dim);animation:dashboard-status-typing 1.2s ease-in-out infinite;animation-play-state:paused}
.connection[data-phase=offline]:before{background:var(--muted)}

@keyframes dashboard-status-typing{0%,100%{background:currentColor;box-shadow:6px 0 var(--dim),12px 0 var(--dim)}33%{background:var(--dim);box-shadow:6px 0 currentColor,12px 0 var(--dim)}66%{background:var(--dim);box-shadow:6px 0 var(--dim),12px 0 currentColor}}
@media(prefers-reduced-motion:reduce){.connection:before,.connection:after{animation:none!important}}

/* Loading screen while the dashboard agent drafts the first view; it appears late to avoid flashing on reloads. */
.loading-screen{display:none}
html[data-loading] body>header,html[data-loading] main,html[data-loading] footer{display:none}
html[data-loading] .loading-screen{display:grid;place-items:center;align-content:center;gap:18px;min-height:100dvh;padding:16px;animation:dashboard-reveal .3s ease-out .25s both}
.loading-title{font-size:15px;font-weight:700;color:var(--muted);text-align:center;max-width:40ch}
.loading-title:empty{display:none}
.loading-bar{inline-size:min(14rem,100%);block-size:.3rem;overflow:clip;border-radius:9999px;background:color-mix(in srgb,var(--doing) 20%,transparent);color:var(--doing)}
.loading-bar>div{inline-size:40%;block-size:100%;border-radius:inherit;background:currentColor}
@media(prefers-reduced-motion:no-preference){.loading-bar>div{animation:dashboard-loading 1.4s ease-in-out infinite alternate}}

@keyframes dashboard-loading{to{translate:150%}}
@keyframes dashboard-reveal{from{opacity:0}}

const C=window.DashboardComponents, el=C.element, t=C.t;
const offline=location.protocol==='file:';
const html=document.documentElement, loadingStarted=Date.now();
// Transport problems win over the agent activity reported by the server.
let transport=offline?'offline':'connecting',activity='idle';
function showStatus(){const phase=transport==='live'?activity:transport;const text=t('connection.'+phase);if(connection.textContent!==text)connection.textContent=text;connection.dataset.phase=phase==='reconnecting'?'error':phase;}
// The first draft stays behind a loading screen; ?draft lets the dashboard agent inspect its work.
function endLoading(){if(!html.hasAttribute('data-loading'))return;html.removeAttribute('data-loading');if(Date.now()-loadingStarted>250)html.dataset.revealed='';}
if(offline||new URLSearchParams(location.search).has('draft'))endLoading();
function defaultRender(s,target){
const tasks=s.tasks||[],intro=el('section',null,'intro'),line=el('div',null,'intro-line');
line.append(el('h1',s.title||t('app.untitled')));
const blocked=tasks.filter(task=>task.status==='blocked').length;if(blocked)line.append(el('span',t('map.blockedCount',{count:blocked}),'blocked-count'));
intro.append(line);if(s.goal)intro.append(el('p',s.goal));target.append(intro,C.evidenceMap(s));
const grid=el('div',null,'layout ad-grid');grid.append(C.evidenceLedger(s));const aside=C.priorityPanels(s);if(aside.childNodes.length)grid.append(aside);else grid.style.gridTemplateColumns='1fr';target.append(grid);
}
function render(s){C.setUi(s.ui);document.getElementById('brand').textContent=t('app.name');document.getElementById('footer-state').textContent=t(offline?'offline.footer':'app.footer');document.getElementById('loading-title').textContent=s.title||'';document.getElementById('loading-bar').setAttribute('aria-label',s.title||t('app.untitled'));showStatus();const open=new Set([...root.querySelectorAll('details[open][data-key]')].map(node=>node.dataset.key));const active=document.activeElement;const focused=active&&root.contains(active)?active.closest('[data-key]')?.dataset.key:null;const scroll=window.scrollY;const staging=document.createElement('div');try{(window.dashboardRender||defaultRender)(s,staging,{element:el,components:C,defaultRender});}catch(error){staging.replaceChildren();defaultRender(s,staging);staging.prepend(el('p',t('app.renderError'),'error'));console.error(error);}root.replaceChildren(...staging.childNodes);root.querySelectorAll('details[data-key]').forEach(node=>{if(open.has(node.dataset.key))node.open=true;});if(focused){const match=[...root.querySelectorAll('[data-key]')].find(node=>node.dataset.key===focused);(match?.matches('details')?match.querySelector('summary'):match)?.focus({preventScroll:true});}window.scrollTo(0,scroll);const english=!C.ui.lang||/^en\b/i.test(C.ui.lang),named=english||typeof C.ui.strings?.['app.name']==='string';document.title=s.title?s.title+(named?' · '+t('app.name'):''):t('app.untitled');}
render(state);
try{const previous=JSON.parse(sessionStorage.getItem('dashboard-view')||'null');if(previous){root.querySelectorAll('details[data-key]').forEach(node=>{if(previous.open.includes(node.dataset.key))node.open=true;});window.scrollTo(0,previous.scroll);sessionStorage.removeItem('dashboard-view');}}catch(_){}
if(offline)return;
let refreshing=false,again=false;
async function refresh(){if(refreshing){again=true;return;}refreshing=true;try{const response=await fetch('/state',{cache:'no-store'});if(!response.ok)throw Error();const next=await response.json();if(next.revision!==state.revision){state=next;render(state);}transport='live';showStatus();}catch(_){transport='error';showStatus();endLoading();setTimeout(refresh,3000);}finally{refreshing=false;if(again){again=false;refresh();}}}
const stream=new EventSource('/events');stream.addEventListener('open',()=>{transport='live';showStatus();refresh();});stream.addEventListener('activity',event=>{activity=['draft','work'].includes(event.data)?event.data:'idle';showStatus();if(activity!=='draft')endLoading();});stream.addEventListener('update',refresh);stream.addEventListener('layout',()=>{try{sessionStorage.setItem('dashboard-view',JSON.stringify({scroll:window.scrollY,open:[...root.querySelectorAll('details[open][data-key]')].map(node=>node.dataset.key)}));}catch(_){}location.reload();});stream.addEventListener('error',()=>{transport='reconnecting';showStatus();endLoading();});
})();
</script>

<script>
(function(){
const root=document.getElementById('dashboard');
if(!root)return;
const observer=new IntersectionObserver(entries=>{for(const entry of entries)entry.target.classList.toggle('motion-visible',entry.isIntersecting);},{threshold:.1});
function observe(){
const working=!!root.querySelector('.r-doing,.card-doing');
root.querySelectorAll('.direction-panel').forEach(panel=>{
panel.classList.toggle('is-working',working);
const title=panel.querySelector('h2');
let badge=panel.querySelector('.now-state');
if(working&&title&&!badge){badge=document.createElement('span');badge.className='now-state';badge.textContent=window.DashboardComponents.t('now.badge');title.append(badge);}
else if(!working&&badge)badge.remove();
});
observer.disconnect();root.querySelectorAll('.is-current .stage-node,.direction-panel,.r-doing .licon,.card-doing .status').forEach(node=>observer.observe(node));}
function visibility(){document.documentElement.dataset.motion=document.hidden?'paused':'running';}
new MutationObserver(observe).observe(root,{childList:true});
document.addEventListener('visibilitychange',visibility);visibility();observe();
})();
</script>
</body>
</html>
